name: VROO Autonomous Loop Signal

on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  signal-ai-project-manager:
    runs-on: ubuntu-latest
    steps:
      - name: Mark PR for AI Project Manager review
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const pr = context.payload.pull_request;
            const label = 'ai-pm-review';

            try {
              await github.rest.issues.getLabel({ owner, repo, name: label });
            } catch (error) {
              if (error.status === 404) {
                await github.rest.issues.createLabel({
                  owner,
                  repo,
                  name: label,
                  color: 'D4AF37',
                  description: 'VROO AI Project Manager review required'
                });
              } else {
                throw error;
              }
            }

            await github.rest.issues.addLabels({
              owner,
              repo,
              issue_number: pr.number,
              labels: [label]
            });

            const marker = '<!-- VROO_AI_PM_SIGNAL -->';
            const body = `${marker}\n🤖 **VROO Autonomous Development Loop v2.0**\n\n이 PR은 AI Project Manager 검토 대기 상태입니다.\n\n- 성공: 검토·테스트 통과 → 병합 → 다음 작업 Issue 생성 → \`@cursor\` 실행\n- 실패: 수정 요청 → Cursor 재작업 → 다시 검토\n\nPR이 업데이트될 때마다 자동으로 검토 대기 신호가 갱신됩니다.`;

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number: pr.number,
              per_page: 100
            });
            const existing = comments.find(c => c.body && c.body.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: pr.number,
                body
              });
            }
