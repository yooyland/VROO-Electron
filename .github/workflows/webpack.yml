name: NodeJS Syntax Check

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  syntax:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js 22.x
      uses: actions/setup-node@v4
      with:
        node-version: 22.x

    - name: Install dependencies
      run: npm ci

    - name: Check JavaScript syntax
      run: npm run check:syntax

    - name: Check Heritage Garage runtime
      run: xvfb-run --auto-servernum npx electron --no-sandbox . -- --heritage-runtime-test

    - name: Check chat and Garage workspace runtime
      run: xvfb-run --auto-servernum npx electron --no-sandbox . -- --workspace-runtime-test
